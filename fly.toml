app = "kanban-localfirst-demo"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "1234"
  HOST = "0.0.0.0"
  TRUST_PROXY = "true"
  DATABASE_PATH = "/data/kanban-data.sqlite"
  STATIC_DIR = "/app/apps/client/dist"
  WS_HEARTBEAT_INTERVAL_MS = "15000"

[mounts]
  source = "kanban_data"
  destination = "/data"

[http_service]
  internal_port = 1234
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
